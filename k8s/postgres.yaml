apiVersion: v1
kind: Service
metadata:
  name: desafio3-postgres
spec:
  selector:
    app: desafio3-postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: desafio3-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: desafio3-postgres
  template:
    metadata:
      labels:
        app: desafio3-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - configMapRef:
                name: desafio3-config
            - secretRef:
                name: desafio3-secret
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: desafio3-postgres-pvc
        - name: init-script
          configMap:
            name: desafio3-init-db