apiVersion: v1
kind: PersistentVolume
metadata:
  name: desafio3-postgres-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data/desafio3-postgres"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: desafio3-postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi